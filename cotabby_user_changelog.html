<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Changelog</title>
<style>
/* Changelog UI: shared design system for the project page and the hub. Hand-written, no dependencies, works from file://.
   Design idea: quiet and typographic. One narrow reading column, almost no boxes, one warm accent per project (--accent).
   Colour is used only for a small dot and word per kind of change, never as a filled block, and the word is always shown. */
:root{
  --bg:#faf9f6; --panel:#ffffff; --hover:#f1efe9; --line:#e8e5dd; --line-2:#d9d5ca;
  --ink:#1b1d21; --ink-2:#4b5058; --ink-3:#7a7f87; --focus:#2a62a8;
  --accent:#b0731a; --accent-ink:#ffffff;
  --c-new:#1f7a4d; --c-improved:#2a62a8; --c-fixed:#a8620d; --c-performance:#0e7a80; --c-ui:#6a4fa3;
  --c-qol:#b13d62; --c-behavior:#5a6672; --c-content:#8a6d1f; --c-removed:#8a4b4b;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;
  --r:10px; --ctl:36px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0f13; --panel:#14171c; --hover:#171a20; --line:#1d2128; --line-2:#2a2f38;
  --ink:#ebe9e3; --ink-2:#b2b6bd; --ink-3:#7f858e; --focus:#7fb0ea;
  --accent:#e0a85c; --accent-ink:#1b1306;
  --c-new:#6fd1a0; --c-improved:#7fb0ea; --c-fixed:#ebb867; --c-performance:#6fd0d6; --c-ui:#b6a2ea;
  --c-qol:#f0a0b8; --c-behavior:#a9b6c4; --c-content:#e2c870; --c-removed:#e09a9a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f13; --panel:#14171c; --hover:#171a20; --line:#1d2128; --line-2:#2a2f38;
  --ink:#ebe9e3; --ink-2:#b2b6bd; --ink-3:#7f858e; --focus:#7fb0ea;
  --accent:#e0a85c; --accent-ink:#1b1306;
  --c-new:#6fd1a0; --c-improved:#7fb0ea; --c-fixed:#ebb867; --c-performance:#6fd0d6; --c-ui:#b6a2ea;
  --c-qol:#f0a0b8; --c-behavior:#a9b6c4; --c-content:#e2c870; --c-removed:#e09a9a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding-inline:24px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:54px}
.back{display:inline-flex;white-space:nowrap;flex:none;align-items:center;gap:6px;color:var(--ink-3);text-decoration:none;font-size:.88rem}
.back:hover{color:var(--ink)}
.crumb{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .grow{flex:1}
.search{position:relative;flex:0 1 320px}
.search input{width:100%;height:34px;padding:0 32px 0 34px;border:1px solid transparent;border-radius:999px;background:var(--hover);color:var(--ink);font:inherit;font-size:.9rem}
.search input:focus{outline:none;border-color:var(--line-2);background:var(--panel)}
.search svg{position:absolute;left:11px;top:50%;translate:0 -50%;width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.search .clear{position:absolute;right:4px;top:50%;translate:0 -50%;width:26px;height:26px;border:0;background:none;border-radius:50%;color:var(--ink-3)}
.icon-btn{height:34px;width:34px;border:0;background:none;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink-3)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}

/* header */
.hero{padding-block:56px 20px;display:grid;gap:10px}
.hero h1{font:700 clamp(2rem,4.6vw,2.7rem)/1.05 var(--serif);margin:0;letter-spacing:-.015em}
.hero .meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:.92rem;align-items:center}
.hero .meta strong{color:var(--ink-2);font-weight:600}
.hero .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-3)}
.tag{font-size:.78rem;color:var(--ink-3)}
.accentbar{display:none}

/* filters: quiet text tabs */
.toolbar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding-bottom:0;border-bottom:1px solid var(--line)}
.glance{display:flex;gap:2px;flex-wrap:wrap;align-items:center;margin:0}
.glance .lead{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink-3);font-size:.92rem;border-radius:0}
.chip svg{display:none}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.chip .n{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--ink-3);font-weight:400}
.toolbar .row2{margin-left:auto;display:flex;align-items:center;gap:12px}
.toolbar .spacer{display:none}
.status{color:var(--ink-3);font-size:.85rem}
.toggle{height:30px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;background:none;color:var(--ink-2);font-size:.85rem}
.toggle:hover{background:var(--hover)}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* layout: tiny date rail + a narrow column */
.layout{display:grid;grid-template-columns:120px minmax(0,1fr);gap:40px;padding-block:8px 80px;align-items:start}
.rail{position:sticky;top:76px;padding-top:24px;max-height:calc(100vh - 100px);overflow:auto}
.rail h2{display:none}
.rail ol{list-style:none;margin:0;padding:0}
.rail a{display:flex;justify-content:space-between;padding:5px 0;text-decoration:none;color:var(--ink-3);font-size:.86rem;border-left:2px solid transparent;padding-left:12px;margin-left:-2px}
.rail a:hover{color:var(--ink)}
.rail a[aria-current="true"]{color:var(--ink);border-left-color:var(--accent);font-weight:600}
.rail .c{display:none}
.railsel{display:none}

/* a day */
.day{padding-block:28px 8px}
.day>header{display:grid;gap:2px;padding-bottom:6px}
.day .when{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.day h2{margin:0;font:700 1.15rem/1.2 var(--sans);letter-spacing:-.005em}
.day .rel{order:-1;font-weight:700;font-size:1.15rem}
.day .rel+h2{font-weight:400;color:var(--ink-3);font-size:.95rem}
.day .mix{display:inline;color:var(--ink-3);font-size:.85rem}
.day .mix span{background:none;padding:0;color:inherit}
.day .mix span:not(:last-child)::after{content:" · "}
.day .collapse{margin-left:auto;border:0;background:none;color:var(--ink-3);font-size:.85rem;padding:2px 6px;border-radius:6px}
.day .collapse:hover{color:var(--ink);background:var(--hover)}
.day .summary{margin:0;color:var(--ink-2);max-width:62ch}
.session{margin-top:22px}
.session>h3{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 4px;font:600 .72rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.badges{display:inline;letter-spacing:0;text-transform:none;font-weight:400;font-size:.78rem;color:var(--ink-3)}
.bs{display:inline;background:none;border:0;padding:0}
.bs svg{display:none}
.bs+.bs::before{content:" · "}
.cards{display:grid;gap:0}

/* an entry: no box, just a quiet row */
.card{display:grid;grid-template-columns:104px minmax(0,1fr);column-gap:20px;padding:16px 0;border-top:1px solid var(--line);min-width:0}
.cards>.card:first-child{border-top:0}
.card .head{display:contents}
.cat{display:inline-flex;align-items:center;gap:7px;align-self:start;margin-top:3px;font-size:.78rem;font-weight:600;color:var(--cc);background:none;padding:0;letter-spacing:.01em}
.cat svg{display:none}
.cat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cc);flex:none}
.card .head h4{grid-column:2;grid-row:1;margin:0;font:600 1.02rem/1.35 var(--sans);letter-spacing:-.003em;text-wrap:balance;overflow-wrap:anywhere}
.card .head .cat{grid-column:1;grid-row:1}
.card>*:not(.head){grid-column:2}
.card .sum{margin:4px 0 0;color:var(--ink-2);max-width:64ch}
.card .why{display:none}
.more{border:0;background:none;color:var(--ink-3);padding:6px 0 0;font-size:.84rem;text-align:left;display:inline-flex;align-items:center;gap:5px;width:max-content}
.more:hover{color:var(--ink)}
.more svg{width:11px;height:11px;transition:rotate .15s}
.more[aria-expanded="true"] svg{rotate:90deg}
.detail{margin-top:8px;padding-left:14px;border-left:2px solid var(--accent);display:grid;gap:8px;max-width:64ch;color:var(--ink-2);font-size:.92rem}
.detail p{margin:0}
.detail .notice b{color:var(--ink);font-weight:600}
.tech{font:.8rem/1.5 var(--mono);background:var(--hover);border-radius:8px;padding:12px;color:var(--ink-2);overflow:auto}
.tech ul{margin:6px 0 0;padding-left:18px}
.cat-new{--cc:var(--c-new)} .cat-improved{--cc:var(--c-improved)} .cat-fixed{--cc:var(--c-fixed)} .cat-performance{--cc:var(--c-performance)}
.cat-ui{--cc:var(--c-ui)} .cat-qol{--cc:var(--c-qol)} .cat-behavior{--cc:var(--c-behavior)} .cat-content{--cc:var(--c-content)} .cat-removed{--cc:var(--c-removed)}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:56px 16px;text-align:center;color:var(--ink-3)}
.empty b{display:block;font:600 1.1rem var(--sans);color:var(--ink);margin-bottom:6px}
.loadmore{display:flex;justify-content:flex-start;padding:10px 0 0}
.btn{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:none;font-size:.88rem;color:var(--ink-2)}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.dayrest{margin:6px 0 0 124px}
.foot{padding-block:32px;color:var(--ink-3);font-size:.82rem;border-top:1px solid var(--line)}

/* hub */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));padding-block:14px 80px}
.pcard{display:grid;gap:6px;padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;position:relative;overflow:hidden;min-height:140px;align-content:start}
.pcard::before{content:"";position:absolute;left:20px;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.pcard:hover{border-color:var(--line-2);background:var(--hover)}
.pcard h3{margin:6px 0 0;font:700 1.2rem/1.2 var(--serif)}
.pcard .upd{color:var(--ink-3);font-size:.86rem}
.pcard .latest{color:var(--ink);font-size:.93rem;display:flex;gap:10px;align-items:baseline}
.pcard .nums{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-3);font-size:.84rem}
.pcard .nums b{color:var(--ink-2);font-variant-numeric:tabular-nums}
.pcard .tl{color:var(--ink-3);font-size:.86rem}
.pcard.stale .upd{color:var(--ink-3)}
/* hub overview: working now, latest changes, richer cards */
.hubh{font:700 1.05rem/1.2 var(--sans);margin:34px 0 12px;display:flex;align-items:center;gap:10px}
.live{margin-top:8px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.live .hubh{margin:0 0 10px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--ink-3)}
.pulse.on{background:var(--c-new);box-shadow:0 0 0 0 color-mix(in srgb,var(--c-new) 60%,transparent);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.live .quiet{margin:0 0 8px;color:var(--ink-3);font-size:.9rem}
.sessions{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.sessions li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem;color:var(--ink-3)}
.sessions li:first-child{border-top:0}
.sessions li.on{color:var(--ink)}
.agent{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2)}
.agent-claude{border-color:color-mix(in srgb,#c96442 60%,var(--line-2));color:#c96442}
.agent-codex{border-color:color-mix(in srgb,var(--c-improved) 60%,var(--line-2));color:var(--c-improved)}
.stitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sproj{color:var(--ink-2);font-size:.86rem}
.sago{font-size:.8rem;color:var(--ink-3);white-space:nowrap}
.feed{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.feed li{display:grid;grid-template-columns:96px auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.feed .when{color:var(--ink-3);font-size:.82rem}
.feed a{color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.feed a:hover{text-decoration:underline}
.feed .proj{color:var(--ink-3);font-size:.84rem;text-align:right}
.pcard .phead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.nowdot{font-size:.72rem;font-weight:700;color:var(--c-new);white-space:nowrap}
.nowdot::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c-new);margin-right:6px;vertical-align:1px}
.pcard .nums{align-items:flex-end;justify-content:space-between}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:22px}
.bars span{width:5px;border-radius:2px 2px 0 0;background:var(--accent);opacity:.85}
.bars span.zero{background:var(--line-2);opacity:1}
.pcard .recent{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px}
.pcard .recent li{display:flex;gap:10px;align-items:baseline;font-size:.9rem;color:var(--ink)}
.pcard .recent li+li{color:var(--ink-2)}
@media (max-width:700px){.feed li{grid-template-columns:auto minmax(0,1fr);grid-template-areas:'when cat' 'title title' 'proj proj';row-gap:4px;column-gap:10px}.feed .when{grid-area:when}.feed li>.cat{grid-area:cat;justify-self:start}.feed li>a{grid-area:title;font-weight:500}.feed .proj{grid-area:proj;text-align:left}.sessions li{grid-template-columns:auto minmax(0,1fr)}.sessions .sproj,.sessions .sago{grid-column:2}}
@media (prefers-reduced-motion: reduce){.pulse.on{animation:none}}
.section-label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:32px 0 0;font-weight:600}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:8px}
  .rail{display:none}
  .railsel{display:block;padding-top:14px}
  .railsel select{width:100%;height:44px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel);color:var(--ink);padding:0 10px;font:inherit}
  .search{flex:1 1 140px}
  .hero{padding-block:36px 14px}
  .card{grid-template-columns:minmax(0,1fr);row-gap:2px}
  .card .head h4,.card .head .cat,.card>*:not(.head){grid-column:1}
  .card .head .cat{grid-row:1}.card .head h4{grid-row:2}
  .dayrest{margin-left:0}
  .toolbar{gap:8px}.toolbar .row2{margin-left:0;width:100%;padding-bottom:8px}
  .chip{height:44px}
}
@media print{.top,.rail,.railsel,.toolbar,.more{display:none!important}.detail{display:grid!important}.card{break-inside:avoid}}

/* pictures */
.media{display:grid;gap:12px;margin-top:10px;max-width:640px}
.shot{margin:0;display:grid;gap:6px;min-width:0}
.shotlabel{justify-self:start;font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
/* BEFORE / AFTER tags: one style everywhere (page, slider, lightbox and the compare.py files): white text on red or green */
:root{--before:#c62828;--after:#2e7d32}
.ba{display:inline-block;justify-self:start;font:700 .7rem/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;padding:5px 9px;border-radius:6px;color:#fff;white-space:nowrap}
.ba-before{background:var(--before)}.ba-after{background:var(--after)}
.ba-neutral{background:#5b6670}
.shot figcaption{font-size:.82rem;color:var(--ink-3);line-height:1.4}
.missing{padding:24px;text-align:center;color:var(--ink-3);font-size:.85rem}
/* before / after: both pictures sit in ONE frame of the same size, same crop, same corner, so they can be compared directly */
.cmp{display:grid;gap:8px}
.cmp .stagebox{position:relative;aspect-ratio:16/10;max-height:420px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--hover);--p:50%;user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:ew-resize}
.cmp .stagebox img,.cmp .stagebox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top left;display:block;pointer-events:none}
.cmp .stagebox .after{clip-path:inset(0 0 0 var(--p))}
.cmp .handle{position:absolute;top:0;bottom:0;left:var(--p);width:2px;background:var(--accent);translate:-1px 0;pointer-events:none}
.cmp .knob{position:absolute;top:50%;left:50%;width:34px;height:34px;translate:-50% -50%;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgb(0 0 0 / .35);transition:scale .15s}
.cmp .knob svg{width:13px;height:13px;margin:0 -2px}
.cmp .stagebox.drag .knob{scale:1.12}
.cmp .stagebox.kbd{outline:2px solid var(--focus);outline-offset:2px}
.cmp .tags{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.cmp .tags .ba{box-shadow:0 1px 4px rgb(0 0 0 / .35)}
.cmp .vctl{position:absolute;left:10px;bottom:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgb(10 12 16 / .75);color:#fff;font-size:.78rem;display:grid;place-items:center;cursor:pointer}
.cmp .vctl:hover{background:rgb(10 12 16 / .9)}
.cmp .stagebox.broken::after{content:"Picture not found";position:absolute;inset:auto 0 12px;text-align:center;color:var(--ink-3);font-size:.85rem}
.cmp .row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.cmp figcaption{font-size:.82rem;color:var(--ink-3)}
.cmp .cmpwarn{margin:0;font-size:.8rem;color:var(--c-fixed)}

/* one main visual per change */
.media{max-width:680px}
.mainshot{display:block;position:relative;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--hover);cursor:zoom-in}
.mainshot img{display:block;width:100%;height:auto;max-height:420px;object-fit:cover;object-position:top left}
.mainframe{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--hover)}
.mainframe video{display:block;width:100%;max-height:420px}
.cornertag{position:absolute;top:10px;left:10px}
.cmp .expand{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgb(10 12 16 / .72);color:#fff;display:grid;place-items:center;cursor:zoom-in}
.cmp .expand:hover{background:rgb(10 12 16 / .9)}
.cmp .vctl{left:10px;right:auto}
/* the rest as a quiet strip of thumbnails */
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:120px;height:76px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--hover);cursor:zoom-in}
.thumb:hover{border-color:var(--line-2)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.thumb .split{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%}
.thumb .split img{object-position:top left}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);font-size:.9rem}
.thumb .tt{position:absolute;left:5px;bottom:5px;max-width:calc(100% - 10px);box-sizing:border-box;padding:2px 6px;border-radius:4px;background:rgb(10 12 16 / .78);color:#fff;font:600 11px/1.3 var(--sans);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .tt-before{background:var(--before)}.thumb .tt-after{background:var(--after)}
/* the viewer: full screen, zoom and pan */

/* kinds of change: a coloured icon badge */

/* the update's pictures at a glance */

/* ---------- polish: header, timeline, cards, change callouts ---------- */

.hstats{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 30px;margin-top:14px}

@media (prefers-reduced-motion:no-preference){

  var current = null;

  /* ---------- small helpers for the update page ---------- */
